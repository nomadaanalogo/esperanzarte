  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    hsl(44, 43%, 91%);
      --burgundy: hsl(0, 67%, 32%);
      --ink:      hsl(158, 35%, 10%);
      --muted-fg: hsl(158, 15%, 38%);
      --wa:       #25D366;
      --font:     'Bree Serif', Georgia, serif;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font);
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .pantalla {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .pantalla > * {
      min-width: 0;
      max-width: 100%;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--burgundy);
      font-weight: 700;
    }

    .marca img { width: 26px; height: 26px; border-radius: 50%; }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--burgundy);
      margin-top: 0.5rem;
    }

    h1 {
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      line-height: 1.2;
      margin-top: 0.35rem;
    }

    .foto {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      border-radius: 1rem;
      overflow: hidden;
      margin: 0.75rem 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      flex-shrink: 1;
      min-height: 0;
    }

    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .subtitulo {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      color: var(--muted-fg);
      line-height: 1.5;
      max-width: 340px;
    }

    .precio {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .precio-antes {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      color: var(--muted-fg);
      text-decoration: line-through;
    }

    .precio-hoy {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a9e4a;
    }

    .btn-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      max-width: 340px;
      background: var(--wa);
      color: #0b1a10;
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1.05rem 1.5rem;
      border-radius: 0.85rem;
      border: none;
      text-decoration: none;
      margin-top: 1.1rem;
      box-shadow: 0 10px 28px rgba(37,211,102,0.4);
    }

    .btn-wa svg { width: 24px; height: 24px; flex-shrink: 0; }

    .nota {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      color: var(--muted-fg);
      margin-top: 0.6rem;
    }

    @media (min-height: 720px) {
      .pantalla { padding-top: 2rem; gap: 0.85rem; }
      .foto { max-width: 320px; }
    }
  </style>
